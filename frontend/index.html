<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <title>Cipher</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0a0a0f;--surface:#111118;--border:#1e1e2e;--accent:#7c6af7;--accent2:#f76a8a;--text:#e8e8f0;--muted:#555570;--bme:#1e1a3a;--bthem:#161620;--r:14px}
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;overflow:hidden}

    /* AUTH */
    #auth{height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
    #auth::before{content:'';position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:40px 40px;opacity:.35}
    .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.12;pointer-events:none}
    .b1{width:500px;height:500px;background:var(--accent);top:-150px;left:-150px}
    .b2{width:350px;height:350px;background:var(--accent2);bottom:-100px;right:-100px}
    .acard{position:relative;z-index:1;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:52px 48px;width:400px;box-shadow:0 40px 100px rgba(0,0,0,.6)}
    .alogo{font-family:'Syne',sans-serif;font-size:36px;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
    .atag{font-size:11px;color:var(--muted);margin-bottom:36px;letter-spacing:.8px}
    .atabs{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:28px}
    .atab{flex:1;padding:9px;border-radius:7px;border:none;font-family:'Syne',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.5px;background:transparent;color:var(--muted)}
    .atab.on{background:var(--surface);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.4)}
    .afield{margin-bottom:14px}
    .afield label{display:block;font-size:10px;color:var(--muted);margin-bottom:6px;letter-spacing:1.5px;text-transform:uppercase}
    .afield input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-family:'DM Mono',monospace;font-size:13px;outline:none;transition:border-color .2s}
    .afield input:focus{border-color:var(--accent)}
    .afield input::placeholder{color:var(--muted)}
    .asub{width:100%;margin-top:24px;padding:14px;background:linear-gradient(135deg,var(--accent),#6a58e0);border:none;border-radius:10px;color:#fff;font-family:'Syne',sans-serif;font-size:14px;font-weight:700;letter-spacing:.5px;cursor:pointer;transition:all .2s;box-shadow:0 4px 20px rgba(124,106,247,.3)}
    .asub:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(124,106,247,.45)}
    .aerr{font-size:12px;color:var(--accent2);margin-top:14px;text-align:center;min-height:18px}

    /* APP */
    #app{display:none;height:100vh;grid-template-columns:268px 1fr}
    #app.on{display:grid}
    .sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
    .sbhead{padding:18px 16px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
    .sblogo{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .upill{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted)}
    .uav{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:'Syne',sans-serif;color:#fff}
    .clabel{padding:14px 16px 8px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
    .clist{flex:1;overflow-y:auto;padding:0 8px 8px}
    .citem{padding:10px 12px;border-radius:10px;cursor:pointer;transition:background .15s;display:flex;align-items:center;gap:10px;margin-bottom:2px}
    .citem:hover{background:var(--border)}
    .citem.on{background:#1e1a3a}
    .cav{width:36px;height:36px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;font-family:'Syne',sans-serif;color:#fff}
    .cinfo{flex:1;min-width:0}
    .cname{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Syne',sans-serif}
    .csub{font-size:11px;color:var(--muted);margin-top:2px}
    .ncbtn{margin:8px;padding:10px;background:transparent;border:1px dashed var(--border);border-radius:10px;color:var(--muted);font-family:'Syne',sans-serif;font-size:12px;cursor:pointer;transition:all .2s}
    .ncbtn:hover{border-color:var(--accent);color:var(--accent)}
    .lobtn{margin:0 8px 8px;padding:8px;background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;transition:all .2s}
    .lobtn:hover{border-color:var(--accent2);color:var(--accent2)}

    .main{display:flex;flex-direction:column;overflow:hidden}
    .wsbar{font-size:10px;padding:3px 18px;background:var(--bg);border-bottom:1px solid var(--border);color:var(--muted);display:flex;align-items:center;gap:5px}
    .wsdot{width:5px;height:5px;border-radius:50%;background:var(--muted)}
    .wsdot.on{background:#4ade80}
    .wsdot.err{background:var(--accent2)}
    .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted)}
    .eico{font-size:48px;opacity:.2}
    .etxt{font-family:'Syne',sans-serif;font-size:15px}
    .esub{font-size:11px}

    #cv{display:none;flex-direction:column;flex:1;overflow:hidden}
    #cv.on{display:flex}
    .chdr{padding:14px 20px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:space-between}
    .chl{display:flex;align-items:center;gap:12px}
    .chav{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;font-family:'Syne',sans-serif;color:#fff}
    .chn{font-family:'Syne',sans-serif;font-size:15px;font-weight:600}
    .chsb{font-size:11px;color:var(--muted);margin-top:1px}
    .sdot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#4ade80;margin-right:4px}
    .ibtn{width:32px;height:32px;border-radius:8px;background:transparent;border:1px solid var(--border);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:14px}
    .ibtn:hover{border-color:var(--accent);color:var(--accent)}
    .hbtns{display:flex;gap:6px}

    .msgs{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
    .msgs::-webkit-scrollbar{width:3px}
    .msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
    .mrow{display:flex;align-items:flex-end;gap:8px}
    .mrow.me{flex-direction:row-reverse}
    .mav{width:24px;height:24px;border-radius:50%;flex-shrink:0;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;font-family:'Syne',sans-serif}
    .mav.me{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
    .bub{max-width:65%;padding:10px 14px;border-radius:var(--r);font-size:13px;line-height:1.55;border:1px solid transparent}
    .bub.them{background:var(--bthem);border-color:var(--border);border-bottom-left-radius:4px}
    .bub.me{background:var(--bme);border-color:#2e2860;border-bottom-right-radius:4px}
    .bmeta{display:flex;align-items:center;gap:6px;margin-top:5px}
    .btime{font-size:10px;color:var(--muted)}
    .tbtn{font-size:10px;color:var(--muted);background:none;border:none;cursor:pointer;font-family:inherit;padding:0;transition:color .15s}
    .tbtn:hover{color:var(--accent)}
    .trl{font-size:12px;color:var(--muted);margin-top:6px;padding-top:6px;border-top:1px solid var(--border);font-style:italic}
    .sysmsg{text-align:center;font-size:11px;color:var(--muted);padding:10px 16px;background:var(--surface);border-radius:8px;border:1px solid var(--border);margin:4px 0}
    .sumbox{background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:14px 18px;margin:8px 0;font-size:12px;line-height:1.7;color:var(--text)}
    .sumbox strong{color:var(--accent);font-family:'Syne',sans-serif;font-size:11px;letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:8px}

    .iarea{padding:14px 20px;background:var(--surface);border-top:1px solid var(--border)}
    .vind{display:none;align-items:center;gap:8px;font-size:11px;color:var(--accent2);padding:4px 0 8px}
    .vind.on{display:flex}
    .wave{display:flex;gap:3px;align-items:center}
    .wave span{width:3px;height:12px;background:var(--accent2);border-radius:2px;animation:wave .8s ease-in-out infinite}
    .wave span:nth-child(2){animation-delay:.1s}.wave span:nth-child(3){animation-delay:.2s}.wave span:nth-child(4){animation-delay:.15s}
    @keyframes wave{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
    .irow{display:flex;align-items:flex-end;gap:8px}
    .iwrap{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px 14px;transition:border-color .2s}
    .iwrap:focus-within{border-color:var(--accent)}
    #mi{width:100%;background:none;border:none;outline:none;color:var(--text);font-family:'DM Mono',monospace;font-size:13px;resize:none;line-height:1.5;max-height:120px;min-height:22px;display:block}
    #mi::placeholder{color:var(--muted)}
    .sndbtn{width:40px;height:40px;border-radius:10px;border:none;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s;flex-shrink:0}
    .sndbtn:hover{background:#6a58e0;transform:scale(1.05)}
    .sndbtn:active{transform:scale(.95)}
    .vbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .2s;flex-shrink:0}
    .vbtn:hover{border-color:var(--accent2);color:var(--accent2)}
    .vbtn.rec{background:var(--accent2);border-color:var(--accent2);color:#fff;animation:pulse 1s infinite}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(247,106,138,.4)}50%{box-shadow:0 0 0 8px rgba(247,106,138,0)}}

    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--surface);border:1px solid var(--border);padding:10px 20px;border-radius:8px;font-size:12px;opacity:0;transition:all .25s;pointer-events:none;z-index:999}
    .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
    ::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

    /* MODAL */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:100;display:none;align-items:center;justify-content:center}
    .modal-overlay.on{display:flex}
    .modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px;width:420px;box-shadow:0 40px 80px rgba(0,0,0,.6)}
    .modal h3{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;margin-bottom:6px}
    .modal p{font-size:11px;color:var(--muted);margin-bottom:24px;letter-spacing:.5px}
    .mfield{margin-bottom:14px}
    .mfield label{display:block;font-size:10px;color:var(--muted);margin-bottom:6px;letter-spacing:1.5px;text-transform:uppercase}
    .mfield input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--text);font-family:'DM Mono',monospace;font-size:13px;outline:none;transition:border-color .2s}
    .mfield input:focus{border-color:var(--accent)}
    .mfield input::placeholder{color:var(--muted)}
    .mtype{display:flex;gap:8px;margin-bottom:18px}
    .mtype-btn{flex:1;padding:9px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'Syne',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.5px}
    .mtype-btn.on{border-color:var(--accent);color:var(--accent);background:rgba(124,106,247,.08)}
    .user-search-results{max-height:160px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;margin-top:6px;display:none}
    .user-search-results.on{display:block}
    .usr-item{padding:9px 14px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:8px;transition:background .15s}
    .usr-item:hover{background:var(--border)}
    .usr-item.selected{background:rgba(124,106,247,.12);color:var(--accent)}
    .usr-av{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;font-family:'Syne',sans-serif;color:#fff;flex-shrink:0}
    .selected-users{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;min-height:0}
    .stag{background:rgba(124,106,247,.15);border:1px solid rgba(124,106,247,.3);border-radius:6px;padding:4px 10px;font-size:11px;color:var(--accent);display:flex;align-items:center;gap:6px}
    .stag button{background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;line-height:1;padding:0}
    .mbtns{display:flex;gap:8px;margin-top:20px}
    .mbtn{flex:1;padding:11px;border-radius:10px;border:none;font-family:'Syne',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
    .mbtn.primary{background:linear-gradient(135deg,var(--accent),#6a58e0);color:#fff}
    .mbtn.primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(124,106,247,.4)}
    .mbtn.cancel{background:transparent;border:1px solid var(--border);color:var(--muted)}
    .mbtn.cancel:hover{border-color:var(--accent2);color:var(--accent2)}

    /* SUMMARY LANG PICKER */
    .sum-lang{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
    .sum-lang-btn{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;transition:all .2s}
    .sum-lang-btn.on{border-color:var(--accent);color:var(--accent);background:rgba(124,106,247,.08)}
  </style>
</head>
<body>

<div id="auth">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="acard">
    <div class="alogo">cipher</div>
    <div class="atag">// защищённый мессенджер с AI</div>
    <div class="atabs">
      <button class="atab on" id="t-in" onclick="stab('in')">ВОЙТИ</button>
      <button class="atab" id="t-up" onclick="stab('up')">РЕГИСТРАЦИЯ</button>
    </div>
    <div id="f-in">
      <div class="afield"><label>логин</label><input id="iu" placeholder="username"/></div>
      <div class="afield"><label>пароль</label><input id="ip" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()"/></div>
      <button class="asub" onclick="login()">ВОЙТИ →</button>
    </div>
    <div id="f-up" style="display:none">
      <div class="afield"><label>логин</label><input id="uu" placeholder="username"/></div>
      <div class="afield"><label>телефон</label><input id="uph" placeholder="+7..."/></div>
      <div class="afield"><label>пароль</label><input id="upw" type="password" placeholder="••••••••"/></div>
      <button class="asub" onclick="reg()">СОЗДАТЬ АККАУНТ →</button>
    </div>
    <div class="aerr" id="aerr"></div>
  </div>
</div>

<!-- NEW CHAT MODAL -->
<div class="modal-overlay" id="ncModal">
  <div class="modal">
    <h3>Новый чат</h3>
    <p>// выбери тип и добавь участников</p>
    <div class="mtype">
      <button class="mtype-btn on" id="mt-private" onclick="setChatType('private')">ЛИЧНЫЙ</button>
      <button class="mtype-btn" id="mt-group" onclick="setChatType('group')">ГРУППА</button>
    </div>
    <div class="mfield" id="chatNameWrap" style="display:none">
      <label>название группы</label>
      <input id="chatNameInp" placeholder="Название..."/>
    </div>
    <div class="mfield">
      <label>добавить участников</label>
      <input id="userSearch" placeholder="Поиск по username..." oninput="searchUsers(this.value)"/>
      <div class="user-search-results" id="userResults"></div>
    </div>
    <div class="selected-users" id="selectedUsers"></div>
    <div class="mbtns">
      <button class="mbtn cancel" onclick="closeModal()">ОТМЕНА</button>
      <button class="mbtn primary" onclick="createChat()">СОЗДАТЬ →</button>
    </div>
  </div>
</div>

<!-- SUMMARY MODAL -->
<div class="modal-overlay" id="sumModal">
  <div class="modal">
    <h3>Саммари чата</h3>
    <p>// AI сожмёт всю переписку в краткую выжимку</p>
    <div class="mfield">
      <label>язык ответа</label>
      <div class="sum-lang">
        <button class="sum-lang-btn on" onclick="setSumLang('en',this)">EN</button>
        <button class="sum-lang-btn" onclick="setSumLang('ru',this)">RU</button>
        <button class="sum-lang-btn" onclick="setSumLang('de',this)">DE</button>
        <button class="sum-lang-btn" onclick="setSumLang('fr',this)">FR</button>
        <button class="sum-lang-btn" onclick="setSumLang('es',this)">ES</button>
      </div>
    </div>
    <div class="mbtns">
      <button class="mbtn cancel" onclick="closeSumModal()">ОТМЕНА</button>
      <button class="mbtn primary" onclick="runSummary()">ГЕНЕРИРОВАТЬ →</button>
    </div>
  </div>
</div>

<div id="app">
  <aside class="sidebar">
    <div class="sbhead">
      <div class="sblogo">cipher</div>
      <div class="upill"><div class="uav" id="uav">?</div><span id="unm">—</span></div>
    </div>
    <div class="clabel">ЧАТЫ</div>
    <div class="clist" id="cl"></div>
    <button class="ncbtn" onclick="openNewChatModal()">+ новый чат</button>
    <button class="lobtn" onclick="logout()">выйти</button>
  </aside>
  <main class="main">
    <div class="wsbar"><div class="wsdot" id="wd"></div><span id="wl">не подключено</span></div>
    <div class="empty" id="emp"><div class="eico">◈</div><div class="etxt">Выберите чат</div><div class="esub">или создайте новый</div></div>
    <div id="cv">
      <div class="chdr">
        <div class="chl">
          <div class="chav" id="chav">?</div>
          <div><div class="chn" id="chn">—</div><div class="chsb"><span class="sdot"></span>онлайн</div></div>
        </div>
        <div class="hbtns">
          <button class="ibtn" title="Саммари" onclick="openSumModal()">◈</button>
        </div>
      </div>
      <div class="msgs" id="msgs"></div>
      <div class="iarea">
        <div class="vind" id="vi"><div class="wave"><span></span><span></span><span></span><span></span></div>запись...</div>
        <div class="irow">
          <button class="vbtn" id="vb" onclick="toggleRec()">🎤</button>
          <div class="iwrap"><textarea id="mi" placeholder="Сообщение..." rows="1" onkeydown="hk(event)" oninput="rs(this)"></textarea></div>
          <button class="sndbtn" onclick="snd()">➤</button>
        </div>
      </div>
    </div>
  </main>
</div>
<div class="toast" id="tst"></div>

<script>
const API='http://127.0.0.1:8000',ML='http://127.0.0.1:8001';
let tok=null,usr=null,ws=null,cid=null,mr=null,ch=[],rec=false;
let chatType='private', selectedUserIds=[], sumLang='en';

// ── AUTH ──────────────────────────────────────────────────────────────
function stab(t){
  document.getElementById('t-in').classList.toggle('on',t==='in');
  document.getElementById('t-up').classList.toggle('on',t==='up');
  document.getElementById('f-in').style.display=t==='in'?'':'none';
  document.getElementById('f-up').style.display=t==='up'?'':'none';
  document.getElementById('aerr').textContent='';
}
function setErr(m){document.getElementById('aerr').textContent=m;}

async function login(){
  const u=document.getElementById('iu').value.trim(),p=document.getElementById('ip').value.trim();
  if(!u||!p) return setErr('Заполни все поля');
  try{
    const r=await fetch(`${API}/auth/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p,phone:'+70000000000'})});
    const d=await r.json();
    if(!r.ok) return setErr(d.detail||'Неверный логин или пароль');
    tok=d.access_token;
    const me=await fetch(`${API}/auth/me`,{headers:{Authorization:`Bearer ${tok}`}});
    if(me.ok) usr=await me.json();
    showApp();
  }catch(e){setErr('Сервер недоступен');}
}

async function reg(){
  const u=document.getElementById('uu').value.trim(),ph=document.getElementById('uph').value.trim(),p=document.getElementById('upw').value.trim();
  if(!u||!ph||!p) return setErr('Заполни все поля');
  try{
    const r=await fetch(`${API}/auth/register`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,phone:ph,password:p})});
    const d=await r.json();
    if(!r.ok) return setErr(d.detail||'Ошибка');
    toast('Аккаунт создан! Войди.'); stab('in');
    document.getElementById('iu').value=u;
  }catch(e){setErr('Сервер недоступен');}
}

function logout(){
  tok=null;usr=null;ws&&ws.close();
  document.getElementById('app').classList.remove('on');
  document.getElementById('auth').style.display='flex';
  document.getElementById('cl').innerHTML='';
  document.getElementById('msgs').innerHTML='';
  document.getElementById('cv').classList.remove('on');
  document.getElementById('emp').style.display='flex';
  cid=null;
}

function showApp(){
  document.getElementById('auth').style.display='none';
  document.getElementById('app').classList.add('on');
  if(usr){document.getElementById('unm').textContent=usr.username;document.getElementById('uav').textContent=usr.username[0].toUpperCase();}
  loadChats(); connectWS();
}

// ── WEBSOCKET ─────────────────────────────────────────────────────────
function connectWS(){
  if(!tok) return;
  ws=new WebSocket(`ws://127.0.0.1:8000/ws?token=${tok}`);
  ws.onopen=()=>wsS(true);
  ws.onclose=()=>{wsS(false);setTimeout(connectWS,3000);};
  ws.onerror=()=>wsS(false,true);
  ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='new_message'&&m.data.chat_id===cid)addMsg(m.data,false);if(m.type==='error')toast(m.message);};
}
function wsS(ok,e=false){
  document.getElementById('wd').className='wsdot'+(ok?' on':e?' err':'');
  document.getElementById('wl').textContent=ok?'подключено':e?'ошибка':'переподключение...';
}

// ── CHATS ─────────────────────────────────────────────────────────────
async function loadChats(){
  if(!tok) return;
  try{const r=await fetch(`${API}/chats/`,{headers:{Authorization:`Bearer ${tok}`}});if(!r.ok)return;renderChats(await r.json());}catch(e){}
}
function renderChats(chats){
  const l=document.getElementById('cl'); l.innerHTML='';
  if(!chats.length){l.innerHTML='<div style="padding:16px;font-size:11px;color:var(--muted);text-align:center">Нет чатов</div>';return;}
  chats.forEach(c=>{
    const name=c.name||`Чат #${c.id}`;
    const el=document.createElement('div');
    el.className='citem'+(c.id===cid?' on':'');
    el.innerHTML=`<div class="cav">${name[0].toUpperCase()}</div><div class="cinfo"><div class="cname">${name}</div><div class="csub">${c.is_group?'группа':'личный'}</div></div>`;
    el.onclick=()=>openChat(c,el); l.appendChild(el);
  });
}
async function openChat(c,el){
  cid=c.id;
  document.querySelectorAll('.citem').forEach(i=>i.classList.remove('on'));
  el.classList.add('on');
  const name=c.name||`Чат #${c.id}`;
  document.getElementById('chn').textContent=name;
  document.getElementById('chav').textContent=name[0].toUpperCase();
  document.getElementById('emp').style.display='none';
  document.getElementById('cv').classList.add('on');
  await loadMsgs();
}
async function loadMsgs(){
  if(!cid||!tok)return;
  try{
    const r=await fetch(`${API}/messages/${cid}`,{headers:{Authorization:`Bearer ${tok}`}});
    if(!r.ok)return;
    const ms=await r.json(),c=document.getElementById('msgs');
    c.innerHTML=''; ms.forEach(m=>addMsg(m,true)); c.scrollTop=c.scrollHeight;
  }catch(e){}
}

// ── NEW CHAT MODAL ────────────────────────────────────────────────────
function openNewChatModal(){
  chatType='private'; selectedUserIds=[];
  document.getElementById('userSearch').value='';
  document.getElementById('userResults').innerHTML='';
  document.getElementById('userResults').classList.remove('on');
  document.getElementById('selectedUsers').innerHTML='';
  document.getElementById('chatNameInp').value='';
  document.getElementById('chatNameWrap').style.display='none';
  document.getElementById('mt-private').classList.add('on');
  document.getElementById('mt-group').classList.remove('on');
  document.getElementById('ncModal').classList.add('on');
}
function closeModal(){
  document.getElementById('ncModal').classList.remove('on');
}
function setChatType(t){
  chatType=t;
  document.getElementById('mt-private').classList.toggle('on',t==='private');
  document.getElementById('mt-group').classList.toggle('on',t==='group');
  document.getElementById('chatNameWrap').style.display=t==='group'?'':'none';
}

let searchTimer=null;
async function searchUsers(q){
  clearTimeout(searchTimer);
  const res=document.getElementById('userResults');
  if(!q.trim()){res.classList.remove('on');res.innerHTML='';return;}
  searchTimer=setTimeout(async()=>{
    try{
      const r=await fetch(`${API}/users/?search=${encodeURIComponent(q)}`,{headers:{Authorization:`Bearer ${tok}`}});
      if(!r.ok)return;
      const users=await r.json();
      const filtered=users.filter(u=>u.id!==usr?.id);
      if(!filtered.length){res.innerHTML='<div style="padding:10px 14px;font-size:11px;color:var(--muted)">Не найдено</div>';res.classList.add('on');return;}
      res.innerHTML=filtered.map(u=>`<div class="usr-item${selectedUserIds.includes(u.id)?' selected':''}" onclick="toggleUser(${u.id},'${esc(u.username)}')"><div class="usr-av">${u.username[0].toUpperCase()}</div>${esc(u.username)}</div>`).join('');
      res.classList.add('on');
    }catch(e){}
  },300);
}

function toggleUser(id, name){
  if(selectedUserIds.includes(id)){
    selectedUserIds=selectedUserIds.filter(i=>i!==id);
  }else{
    if(chatType==='private'&&selectedUserIds.length>=1){toast('Для личного чата — только 1 участник');return;}
    selectedUserIds.push(id);
  }
  renderSelectedUsers();
  // refresh search results highlight
  document.querySelectorAll('.usr-item').forEach(el=>{
    const uid=parseInt(el.getAttribute('onclick').match(/\d+/)[0]);
    el.classList.toggle('selected',selectedUserIds.includes(uid));
  });
}

function renderSelectedUsers(){
  const wrap=document.getElementById('selectedUsers');
  if(!selectedUserIds.length){wrap.innerHTML='';return;}
  // we store name alongside id
  wrap.innerHTML=selectedUserIds.map(id=>{
    const el=document.querySelector(`.usr-item[onclick*="toggleUser(${id},"]`);
    const name=el?el.textContent.trim():`User ${id}`;
    return `<div class="stag">${esc(name)}<button onclick="toggleUser(${id},'')">×</button></div>`;
  }).join('');
}

async function createChat(){
  if(!selectedUserIds.length){toast('Добавь хотя бы одного участника');return;}
  const isGroup=chatType==='group';
  const name=isGroup?(document.getElementById('chatNameInp').value.trim()||'Группа'):null;
  if(isGroup&&!name){toast('Введи название группы');return;}
  try{
    const r=await fetch(`${API}/chats/`,{
      method:'POST',
      headers:{Authorization:`Bearer ${tok}`,'Content-Type':'application/json'},
      body:JSON.stringify({name:name||`Чат с ${selectedUserIds[0]}`,is_group:isGroup,is_public:false,member_ids:selectedUserIds})
    });
    if(r.ok){toast('Чат создан ✓');closeModal();loadChats();}
    else{const d=await r.json();toast(d.detail||'Ошибка');}
  }catch(e){toast('Ошибка');}
}

// ── MESSAGES ──────────────────────────────────────────────────────────
function addMsg(msg,init=false){
  const c=document.getElementById('msgs');
  const isMe=usr&&msg.sender_id===usr.id;
  const time=new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
  const letter=isMe?(usr?.username?.[0]?.toUpperCase()||'Y'):'?';
  const row=document.createElement('div');
  row.className='mrow'+(isMe?' me':'');
  row.innerHTML=`<div class="mav ${isMe?'me':''}">${letter}</div><div class="bub ${isMe?'me':'them'}"><div class="bc">${esc(msg.content)}</div><div class="bmeta"><span class="btime">${time}</span>${!isMe?'<button class="tbtn" onclick="doTr(this)">перевести</button>':''}</div></div>`;
  c.appendChild(row);
  if(!init) c.scrollTop=c.scrollHeight;
}
function snd(){
  const inp=document.getElementById('mi'),content=inp.value.trim();
  if(!content||!cid||!ws||ws.readyState!==1)return;
  ws.send(JSON.stringify({chat_id:cid,content}));
  addMsg({content,sender_id:usr?.id,chat_id:cid},false);
  inp.value=''; inp.style.height='auto';
}
function hk(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();snd();}}
function rs(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';}

// ── VOICE ─────────────────────────────────────────────────────────────
async function toggleRec(){
  if(!rec){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      mr=new MediaRecorder(stream); ch=[];
      mr.ondataavailable=e=>ch.push(e.data);
      mr.onstop=sendVoice; mr.start(); rec=true;
      document.getElementById('vb').classList.add('rec');
      document.getElementById('vi').classList.add('on');
    }catch(e){toast('Нет доступа к микрофону');}
  }else{
    mr&&mr.stop(); rec=false;
    document.getElementById('vb').classList.remove('rec');
    document.getElementById('vi').classList.remove('on');
  }
}
async function sendVoice(){
  const blob=new Blob(ch,{type:'audio/webm'}),form=new FormData();
  form.append('file',blob,'voice.webm'); toast('Транскрибирую...');
  try{
    const r=await fetch(`${ML}/audio/transcribe`,{method:'POST',body:form});
    if(!r.ok)return toast('Ошибка транскрипции');
    const d=await r.json(); document.getElementById('mi').value=d.text; toast('Текст готов ✓');
  }catch(e){toast('ML сервис недоступен');}
}

// ── TRANSLATE ─────────────────────────────────────────────────────────
async function doTr(btn){
  const bub=btn.closest('.bub'),content=bub.querySelector('.bc').textContent;
  btn.textContent='...';
  try{
    const r=await fetch(`${ML}/translate/`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:content,target_lang:'en'})});
    if(!r.ok)return toast('Ошибка перевода');
    const d=await r.json();
    let tr=bub.querySelector('.trl');
    if(!tr){tr=document.createElement('div');tr.className='trl';bub.appendChild(tr);}
    tr.textContent=`[${d.source_lang}→${d.target_lang}] ${d.translated_text}`;
    btn.textContent='скрыть'; btn.onclick=()=>{tr.remove();btn.textContent='перевести';btn.onclick=()=>doTr(btn);};
  }catch(e){toast('ML сервис недоступен');btn.textContent='перевести';}
}

// ── SUMMARY ───────────────────────────────────────────────────────────
function setSumLang(lang, el){
  sumLang=lang;
  document.querySelectorAll('.sum-lang-btn').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
}
function openSumModal(){
  if(!cid){toast('Сначала открой чат');return;}
  document.getElementById('sumModal').classList.add('on');
}
function closeSumModal(){
  document.getElementById('sumModal').classList.remove('on');
}
async function runSummary(){
  closeSumModal();
  toast('Генерирую саммари...');
  try{
    // load messages for current chat
    const r=await fetch(`${API}/messages/${cid}`,{headers:{Authorization:`Bearer ${tok}`}});
    if(!r.ok)return toast('Не удалось загрузить сообщения');
    const msgs=await r.json();
    if(!msgs.length)return toast('Нет сообщений для анализа');

    const payload={
      messages: msgs.map(m=>({
        author: m.sender_id===usr?.id ? (usr.username||'me') : `user_${m.sender_id}`,
        text: m.content,
        timestamp: m.created_at||null
      })),
      target_lang: sumLang
    };

    const sr=await fetch(`${ML}/summarize/`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!sr.ok)return toast('Ошибка саммари');
    const d=await sr.json();

    const div=document.createElement('div');
    div.className='sumbox';
    div.innerHTML=`<strong>◈ AI САММАРИ · ${d.processed_count} сообщений · ${d.language.toUpperCase()}</strong>${esc(d.summary_text)}`;
    const c=document.getElementById('msgs'); c.appendChild(div); c.scrollTop=c.scrollHeight;
    toast('Саммари готово ✓');
  }catch(e){toast('ML сервис недоступен');}
}

// ── UTILS ─────────────────────────────────────────────────────────────
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(m){const t=document.getElementById('tst');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2500);}

// close modals on overlay click
document.getElementById('ncModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
document.getElementById('sumModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeSumModal();});
</script>
